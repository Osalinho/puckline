name: Aktualizacja danych PUCKLINE

on:
  schedule:
    # 07:00 UTC = 8:00 czasu polskiego (CET, zima). W czasie letnim (CEST)
    # wypadnie to na 9:00 - GitHub Actions nie umie automatycznie przełączać się na czas letni.
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # pozwala też odpalić ręcznie z zakładki "Actions" na GitHubie

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install requests beautifulsoup4

      - name: Uruchom scraper
        run: python3 scraper.py

      - name: Zacommituj nowe dane (jeśli się zmieniły)
        run: |
          git config user.name "puckline-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet && echo "Brak zmian w danych" || git commit -m "Auto-aktualizacja danych ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
