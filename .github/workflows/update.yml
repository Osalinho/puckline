name: Aktualizacja wyników PUCKLINE

on:
  schedule:
    # 07:00 UTC = 08:00 czasu polskiego zimą (CET), 09:00 latem (CEST) —
    # GitHub Actions nie przełącza się automatycznie na czas letni.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Opcjonalnie: tylko wybrane ligi, np. NHL,AHL (puste = wszystkie 12)'
        required: false
        default: ''
      debug:
        description: 'Zrzuć surowe odpowiedzi 24score.com do artefaktu (do kalibracji parsera)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj zależności
        run: pip install requests beautifulsoup4

      - name: Uruchom scraper
        id: scrape
        env:
          DEBUG: ${{ github.event.inputs.debug == 'true' && '1' || '' }}
        run: |
          set +e
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python scraper.py --only "${{ github.event.inputs.only }}"
          else
            python scraper.py
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ $code -eq 2 ]; then
            echo "::error::Kontrola integralności NIE przeszła — coś by zniknęło z data.json (np. cała liga albo sezon). data.json NIE został zmieniony, NIC nie zostanie scommitowane."
          elif [ $code -eq 1 ]; then
            echo "::warning::Część lig nie została zaktualizowana (błąd pobierania/parsowania) — reszta danych jest bezpieczna i zostanie scommitowana normalnie."
          fi
          exit 0

      - name: Wgraj zrzuty debug (jeśli włączone)
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: puckline-debug-dump
          path: /tmp/puckline_debug/
          if-no-files-found: ignore

      - name: Commituj i wypchnij zaktualizowany data.json
        run: |
          git config user.name "puckline-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "Brak zmian w data.json, nic do commitowania."
          else
            git add data.json
            git commit -m "Auto-update wyników $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Podsumowanie
        run: |
          if [ "${{ steps.scrape.outputs.exit_code }}" == "2" ]; then
            echo "Kontrola integralności nie przeszła — data.json NIE zmieniony. Sprawdź logi kroku 'Uruchom scraper'."
            exit 1
          fi
          if [ "${{ steps.scrape.outputs.exit_code }}" == "1" ]; then
            echo "Uwaga: część lig się nie zaktualizowała, sprawdź logi kroku 'Uruchom scraper' — reszta danych została zapisana."
            exit 1
          fi
