name: Update Hockey Data

on:
  schedule:
    # Automatyczne uruchamianie codziennie o 06:00 UTC (8:00 czasu polskiego)
    - cron: '0 6 * * *'
  workflow_dispatch: # Przycisk "Run workflow" do ręcznego wyzwalania w GitHubie

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl-cffi

      - name: Uruchom scraper
        run: python3 scraper.py

      - name: Zacommituj i wyślij nowe dane
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja data.json [skip ci]" && git push)
